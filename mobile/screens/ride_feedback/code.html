<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .feedback-card-active {
            box-shadow: 0 4px 12px rgba(6, 95, 70, 0.12);
            transform: translateY(-2px);
        }
        .glass-effect {
            backdrop-filter: blur(8px);
            background: rgba(249, 249, 255, 0.95);
        }
        .shimmer-bg {
            background: linear-gradient(90deg, #f1f5f9 25%, #f8fafc 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface overflow-hidden">
<!-- BACKGROUND CONTENT (Blurred/Disabled state) -->
<div class="fixed inset-0 z-0 flex flex-col p-margin-mobile md:p-margin-desktop grayscale blur-[4px] pointer-events-none">
<div class="flex items-center justify-between mb-lg">
<h1 class="font-headline-md text-headline-md text-primary">Sahayatri</h1>
<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional headshot of a middle-aged Nepalese man with a friendly expression, set against a blurred urban background. The lighting is soft and natural, emphasizing trust and reliability in a corporate modern style. The color palette is composed of muted blues and warm skin tones, fitting a professional service app's aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHKWm6rCj1SpgZjqjqqHmM6Cb1usCJ6oKhI9ce9HwxMJzTpORuZYNOmwhQSb5H1v520YKiaoUjuyq-7Jk1LLLmpaJ_Hj4PvlUlDZSm1y2yTf4TR41dOt6UxttZgwJPIPrS-Zi1Ig_4fW2dXZZyEZ253oeTfBY-tmRnyqDm_e9vEAOPuhxFM8oz9ivmC2qSU93y6d73xlRPZXdvKmmJMiApkp7B7GqOD7eiTWrA_I0d2yLjnQCycLLm4G0YaQbHL8XKlDJYKMo95BE"/>
</div>
</div>
<div class="space-y-md">
<div class="h-32 w-full rounded-xl bg-surface-container-low shadow-sm p-md flex flex-col justify-between">
<div class="h-4 w-3/4 rounded bg-surface-variant"></div>
<div class="h-4 w-1/2 rounded bg-surface-variant"></div>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="h-24 rounded-xl bg-surface-container-low"></div>
<div class="h-24 rounded-xl bg-surface-container-low"></div>
</div>
</div>
</div>
<!-- FEEDBACK OVERLAY -->
<div class="fixed inset-0 z-[100] flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-on-surface/40 backdrop-blur-md" id="feedback-overlay">
<!-- MODAL CONTAINER -->
<div class="relative w-full max-w-lg bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- PROGRESS INDICATOR -->
<div class="absolute top-0 left-0 w-full h-1 bg-surface-container">
<div class="h-full bg-primary transition-all duration-500 ease-out" id="progress-bar" style="width: 50%;"></div>
</div>
<div class="p-lg md:p-xl">
<!-- HEADER -->
<header class="mb-lg text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-fixed mb-md">
<span class="material-symbols-outlined text-primary text-[32px]">volunteer_activism</span>
</div>
<h2 class="font-headline-lg-mobile md:font-headline-md text-headline-lg-mobile md:text-headline-md text-on-surface">
                        How was your mutual aid experience?
                    </h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">
                        Your feedback helps maintain trust within the Sahayatri community.
                    </p>
</header>
<!-- FEEDBACK SELECTION GRID -->
<div class="grid grid-cols-2 gap-md mb-lg">
<!-- GOOD OPTION -->
<button class="flex flex-col items-center justify-center p-md h-40 border-2 border-surface-variant rounded-xl transition-all duration-200 hover:bg-primary-container/5 focus:outline-none group" id="btn-good" onclick="selectExperience('good')">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant group-hover:text-primary-container transition-colors mb-sm" id="icon-good">thumb_up</span>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary-container">Good Experience</span>
</button>
<!-- BAD OPTION -->
<button class="flex flex-col items-center justify-center p-md h-40 border-2 border-surface-variant rounded-xl transition-all duration-200 hover:bg-error-container/10 focus:outline-none group" id="btn-bad" onclick="selectExperience('bad')">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant group-hover:text-error transition-colors mb-sm" id="icon-bad">thumb_down</span>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-error">Bad Experience</span>
</button>
</div>
<!-- CONDITIONAL: BAD EXPERIENCE CHECKLIST -->
<div class="hidden animate-in slide-in-from-top-4 duration-300 mb-lg" id="bad-experience-checklist">
<h3 class="font-label-md text-label-md text-on-surface-variant mb-md uppercase tracking-wider">What went wrong?</h3>
<div class="space-y-sm">
<label class="flex items-center p-md bg-surface-container-low rounded-lg border border-outline-variant cursor-pointer transition-colors hover:bg-surface-container-high">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary mr-md" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">Reckless Driving</span>
</label>
<label class="flex items-center p-md bg-surface-container-low rounded-lg border border-outline-variant cursor-pointer transition-colors hover:bg-surface-container-high">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary mr-md" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">Unpunctual</span>
</label>
<label class="flex items-center p-md bg-surface-container-low rounded-lg border border-outline-variant cursor-pointer transition-colors hover:bg-surface-container-high">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary mr-md" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">Inappropriate Behavior</span>
</label>
<label class="flex items-center p-md bg-surface-container-low rounded-lg border border-outline-variant cursor-pointer transition-colors hover:bg-surface-container-high">
<input class="w-5 h-5 rounded border-outline text-primary focus:ring-primary mr-md" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">Asked for Cash</span>
</label>
</div>
</div>
<!-- SUBMIT ACTION -->
<button class="w-full h-12 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-lg shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-sm" onclick="submitFeedback()">
<span>Submit Feedback &amp; Unlock Dashboard</span>
</button>
</div>
</div>
</div>
<!-- SUCCESS TOAST (HIDDEN BY DEFAULT) -->
<div class="fixed top-margin-mobile left-1/2 -translate-x-1/2 z-[110] hidden animate-in slide-in-from-top-full" id="success-toast">
<div class="bg-primary-container text-on-primary-container px-lg py-sm rounded-full shadow-lg flex items-center gap-sm">
<span class="material-symbols-outlined">check_circle</span>
<span class="font-label-md text-label-md">Dashboard Unlocked</span>
</div>
</div>
<script>
        let selection = null;

        function selectExperience(type) {
            selection = type;
            const btnGood = document.getElementById('btn-good');
            const btnBad = document.getElementById('btn-bad');
            const checklist = document.getElementById('bad-experience-checklist');
            const progressBar = document.getElementById('progress-bar');
            const iconGood = document.getElementById('icon-good');
            const iconBad = document.getElementById('icon-bad');

            // Reset classes
            btnGood.className = "flex flex-col items-center justify-center p-md h-40 border-2 border-surface-variant rounded-xl transition-all duration-200 hover:bg-primary-container/5 focus:outline-none group";
            btnBad.className = "flex flex-col items-center justify-center p-md h-40 border-2 border-surface-variant rounded-xl transition-all duration-200 hover:bg-error-container/10 focus:outline-none group";
            iconGood.style.fontVariationSettings = "'FILL' 0";
            iconBad.style.fontVariationSettings = "'FILL' 0";

            if (type === 'good') {
                btnGood.classList.remove('border-surface-variant');
                btnGood.classList.add('border-primary-container', 'bg-primary-container/5', 'feedback-card-active');
                iconGood.style.fontVariationSettings = "'FILL' 1";
                checklist.classList.add('hidden');
                progressBar.style.width = "100%";
            } else {
                btnBad.classList.remove('border-surface-variant');
                btnBad.classList.add('border-error', 'bg-error-container/10', 'feedback-card-active');
                iconBad.style.fontVariationSettings = "'FILL' 1";
                checklist.classList.remove('hidden');
                progressBar.style.width = "75%";
            }
        }

        function submitFeedback() {
            if (!selection) {
                alert('Please select an experience rating before submitting.');
                return;
            }

            const overlay = document.getElementById('feedback-overlay');
            const toast = document.getElementById('success-toast');
            
            // Simulation of submission
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Processing...';
            btn.disabled = true;

            setTimeout(() => {
                overlay.classList.add('fade-out');
                setTimeout(() => {
                    overlay.style.display = 'none';
                    // Unblur the background
                    document.querySelector('.grayscale').classList.remove('grayscale', 'blur-[4px]', 'pointer-events-none');
                    toast.classList.remove('hidden');
                    setTimeout(() => {
                        toast.classList.add('fade-out');
                    }, 3000);
                }, 300);
            }, 1000);
        }
    </script>
</body></html>
